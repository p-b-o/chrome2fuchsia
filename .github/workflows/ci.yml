name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yajl
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libyajl-dev

      - name: Build
        run: make

      - name: Test
        run: make test
